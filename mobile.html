<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #aaa;
    }
    main {
      max-width: 96%;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <div clas="topnav">
      <a href="#home" class="mid" id="navTitle">Our Wedding</a>
      <a href="#" class="icon" onclick="myFunction(); return false;" aria-label="Open navigation menu">
        <span class="menu">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </a>
      <div class="mid" id="navLinks">
        <a href="#home">Home</a>
        <a href="#ourstory">Our Story</a>
        <a href="#details">Details</a>
        <a href="#photos">Photos</a>
        <a href="#weddingparty">Wedding Party</a>
        <a href="#rsvp">RSVP</a>
      </div>
      
    </div>
  </header>
    
  <!-- <div >
    <img src="images/homepage.PNG" class="responsive-img">
  </div> -->
  
  <script>
    // Allow nav bar to open and close
    function myFunction() {
      var x = document.getElementById("navLinks");
      if (x.style.display === "block") {
        x.style.display = "none";
      } else {
        x.style.display = "block";
      }
    }
    // Enable smooth scrolling for anchor links
    document.documentElement.style.scrollBehavior = 'smooth';
  </script>
</body>
</html>
